name: Build

# Every push and PR: typecheck, unit tests, Windows installer (kept as an artifact).
# A version tag (v1.2.3): the same, then the installer is published as a
# GitHub Release, which installed copies pick up through the auto-updater.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $v (use: npm version patch|minor|major)"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # electron-builder uploads the installer and its blockmap in parallel, and
      # each upload creates the release if it is missing: two releases with the
      # same tag, and the update feed can resolve to the one without latest.yml.
      # Creating it first leaves exactly one for both uploads to find.
      - name: Create the release (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package (and publish on a version tag)
        run: npx electron-builder --win --x64 --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: HuskyLog-installer
          path: |
            release/*.exe
            release/latest.yml
          retention-days: 14
